name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly dependency audit, so new RustSec advisories against the locked
  # dependency tree show up without a push. Only the cargo-deny job runs on
  # schedule; the build/test jobs skip (they gate on event_name below).
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC

# Read-only token: CI never needs to write to the repo. No publishing here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment); Dependabot keeps them current via .github/dependabot.yml.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # "1.88" must match rust-version in Cargo.toml (MSRV).
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, and the
      # integration tests run the real binary, which needs them.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --net --map-current-user true

      # Docker Hub rate-limits anonymous pulls from the shared runner addresses
      # (HTTP 429), which failed CI at random. Pull the same image from the AWS
      # public mirror, which has no such limit, and tag it as `alpine`, the name
      # the tests look for.
      - name: Pull alpine for --seal-docker tests
        run: |
          img=public.ecr.aws/docker/library/alpine:latest
          for attempt in 1 2 3 4 5; do
            if docker pull "$img"; then
              docker tag "$img" alpine
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not pull $img" >&2
          exit 1

      # NULLROUTE_REQUIRE_DOCKER turns the Docker tests' skip into a failure.
      # --show-output keeps the tests' own output (including any "SKIPPED"
      # banner and the "docker-test-ran:" lines) in the log.
      - name: cargo test
        env:
          NULLROUTE_REQUIRE_DOCKER: "1"
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -- --show-output 2>&1 | tee test.log
      # A Docker test that can't run (no daemon, no alpine) skips itself loudly
      # locally, but must not be able to hide here: the count of tests that
      # printed "docker-test-ran:" has to equal the number that use Docker.
      - name: All Docker tests ran
        run: |
          ran=$(grep -c '^docker-test-ran: ' test.log || true)
          expected=$(grep -c '!have_alpine()' tests/seal_docker.rs)
          echo "docker tests that ran: $ran, in the source: $expected"
          if [ "$expected" -eq 0 ] || [ "$ran" -ne "$expected" ]; then
            echo "::error::expected $expected Docker tests to run, $ran did"
            exit 1
          fi

  # The release binary is what users run. The suite normally runs against a
  # debug build, where debug-only test hooks and debug_assertions exist; this
  # job runs the same integration tests against --release. Tests that need a
  # debug-only hook are marked #[ignore] with a reason there, and show up as
  # "ignored" in the summary instead of silently not existing.
  test-release:
    name: test (release)
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --net --map-current-user true
      # Docker Hub rate-limits anonymous pulls from the shared runner addresses
      # (HTTP 429), which failed CI at random. Pull the same image from the AWS
      # public mirror, which has no such limit, and tag it as `alpine`, the name
      # the tests look for.
      - name: Pull alpine for --seal-docker tests
        run: |
          img=public.ecr.aws/docker/library/alpine:latest
          for attempt in 1 2 3 4 5; do
            if docker pull "$img"; then
              docker tag "$img" alpine
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not pull $img" >&2
          exit 1
      - name: cargo test --release
        env:
          NULLROUTE_REQUIRE_DOCKER: "1"
        run: |
          set -o pipefail
          cargo test --release --locked --no-fail-fast -- --show-output 2>&1 | tee test.log
      # A Docker test that can't run (no daemon, no alpine) skips itself loudly
      # locally, but must not be able to hide here: the count of tests that
      # printed "docker-test-ran:" has to equal the number that use Docker.
      - name: All Docker tests ran
        run: |
          ran=$(grep -c '^docker-test-ran: ' test.log || true)
          expected=$(grep -c '!have_alpine()' tests/seal_docker.rs)
          echo "docker tests that ran: $ran, in the source: $expected"
          if [ "$expected" -eq 0 ] || [ "$ran" -ne "$expected" ]; then
            echo "::error::expected $expected Docker tests to run, $ran did"
            exit 1
          fi

  # The release targets beyond x86_64 glibc: musl's libc types differ (e.g. the
  # ioctl request is c_int, not c_ulong), so keep them compiling.
  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }}
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings

  # Runs the whole suite against a static musl binary on the x86_64 runner.
  test-musl:
    name: test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --net --map-current-user true
      # Docker Hub rate-limits anonymous pulls from the shared runner addresses
      # (HTTP 429), which failed CI at random. Pull the same image from the AWS
      # public mirror, which has no such limit, and tag it as `alpine`, the name
      # the tests look for.
      - name: Pull alpine for --seal-docker tests
        run: |
          img=public.ecr.aws/docker/library/alpine:latest
          for attempt in 1 2 3 4 5; do
            if docker pull "$img"; then
              docker tag "$img" alpine
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not pull $img" >&2
          exit 1
      - name: cargo test (musl)
        env:
          NULLROUTE_REQUIRE_DOCKER: "1"
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast --target x86_64-unknown-linux-musl -- --show-output 2>&1 | tee test.log
      # A Docker test that can't run (no daemon, no alpine) skips itself loudly
      # locally, but must not be able to hide here: the count of tests that
      # printed "docker-test-ran:" has to equal the number that use Docker.
      - name: All Docker tests ran
        run: |
          ran=$(grep -c '^docker-test-ran: ' test.log || true)
          expected=$(grep -c '!have_alpine()' tests/seal_docker.rs)
          echo "docker tests that ran: $ran, in the source: $expected"
          if [ "$expected" -eq 0 ] || [ "$ran" -ne "$expected" ]; then
            echo "::error::expected $expected Docker tests to run, $ran did"
            exit 1
          fi

  # Non-Linux builds must stop at the single compile_error! in main.rs, not
  # bury it under dozens of missing-libc errors.
  unsupported-targets:
    name: non-Linux build fails cleanly
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-apple-darwin
      - name: cargo check --target x86_64-apple-darwin gives one clear error
        run: |
          if cargo check --locked --color never --target x86_64-apple-darwin > check.log 2>&1; then
            cat check.log
            echo "::error::cargo check for x86_64-apple-darwin unexpectedly succeeded"
            exit 1
          fi
          cat check.log
          grep -q '^error: nullroute only supports Linux' check.log
          # Every compiler error, minus cargo's own "could not compile" summary.
          errors=$(grep '^error' check.log | grep -vc '^error: could not compile' || true)
          if [ "$errors" -ne 1 ]; then
            echo "::error::expected exactly 1 error, got $errors"
            exit 1
          fi

  # The offline-safe parts of the developer examples. NULLROUTE_EXAMPLES_OFFLINE=1
  # makes examples 01 and 03 skip (loudly) every step that needs the public
  # internet, so this job cannot flake on example.com or its rate limits, while
  # everything else still runs and asserts (sealed run fails, --report-json
  # records the blocked target, --strict turns exit 0 into 1, --port bridging).
  # Each script ends with "examples: <name>: N assertions run, M skipped (...)";
  # the greps below pin the exact counts, so a silently skipped assertion fails
  # the job. Examples 02 (needs node, and its only offline-safe check is a sealed
  # run) and 04 (almost entirely about live allowed hosts) are not run here.
  examples:
    name: examples (offline-safe)
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: examples

      # ubuntu-24.04 runners ship shellcheck.
      - name: shellcheck examples and demo scripts
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR examples/*.sh examples/*/run.sh demo/*.sh

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --net --map-current-user true

      - run: cargo build --locked

      - name: Example 01 (python test leak)
        env:
          NULLROUTE_EXAMPLES_OFFLINE: "1"
        run: |
          set -euo pipefail
          ./examples/01-python-test-leak/run.sh 2>&1 | tee "$RUNNER_TEMP/example-01.log"
          # Steps 2, 3, 4 and 4b assert; the two internet steps (1 and 5) are the only skips.
          grep -Fx 'examples: 01-python-test-leak: 4 assertions run, 2 skipped (offline mode)' "$RUNNER_TEMP/example-01.log"

      - name: Example 03 (local service port)
        env:
          NULLROUTE_EXAMPLES_OFFLINE: "1"
        run: |
          set -euo pipefail
          ./examples/03-local-service-port/run.sh 2>&1 | tee "$RUNNER_TEMP/example-03.log"
          # Loopback only: all four assertions run, nothing is skipped.
          grep -Fx 'examples: 03-local-service-port: 4 assertions run, 0 skipped (offline mode)' "$RUNNER_TEMP/example-03.log"

  # Dependency audit against deny.toml: RustSec advisories (vulnerable, unsound,
  # unmaintained, yanked), licence allow-list, bans (wildcards, duplicates) and
  # sources (crates.io only). The only job that also runs on the weekly schedule.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The prebuilt release binary, checked against its published SHA-256. The
      # cargo-deny-action builds a Docker image from Docker Hub on every run,
      # which fails whenever Docker Hub rate-limits the runner.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo-deny --all-features check
