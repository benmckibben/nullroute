[package]
name = "nullroute"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight network isolation and domain filtering sandbox for Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benmckibben/nullroute"
readme = "README.md"
keywords = ["sandbox", "network", "namespace", "security", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["src/**", "tests/**", "README.md", "LICENSE*", "Cargo.*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
libc = "0.2"
