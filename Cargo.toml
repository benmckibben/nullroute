[package]
name = "nullroute"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run commands with outbound network access sealed off: a lightweight Linux network-namespace sandbox with host allowlisting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benmckibben/nullroute"
documentation = "https://github.com/benmckibben/nullroute#readme"
readme = "README.md"
keywords = ["sandbox", "network", "namespace", "security", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]
# Only what's needed to build, test and understand the crate (see "cargo package --list").
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml", "Cargo.lock"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
libc = "0.2"
